[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "app-agent"
version = "0.11.0"
description = "Windows machine onboarding, autonomous app study and verified operation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
windows = ["pywinauto>=0.6.9,<0.7", "sounddevice>=0.5,<0.6", "numpy>=1.26,<3", "Pillow>=10,<13"]
bridge = ["cryptography>=43,<51"]

[project.scripts]
app-agent = "app_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
